<!DOCTYPE html><html><head><title>API Test</title></head><body><h1>API Test</h1><button onclick="testAPI()">Test API</button><div id="result"></div><script>async function testAPI(){try{const response=await fetch("https://ilos-backend.vercel.app/api/applications/141");if(response.ok){const data=await response.json();document.getElementById("result").innerHTML="<h3>✅ API Working!</h3><p>Application ID: "+data.los_id+"</p><p>Customer: "+data.full_name+"</p>";}else{document.getElementById("result").innerHTML="<h3>❌ API Error: "+response.status+"</h3>";}}catch(error){document.getElementById("result").innerHTML="<h3>❌ Network Error: "+error.message+"</h3>";}}</script></body></html>
